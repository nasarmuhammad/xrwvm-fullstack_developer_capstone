name: Cars Dealership - Build and Integration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci --no-audit --no-fund
      - name: Strict production build
        working-directory: server/frontend
        env:
          CI: 'true'
        run: npm run build

  django-models:
    name: Django database and car catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install 'Django==5.2.18' requests python-dotenv Flask nltk
      - name: Django system check
        working-directory: server
        run: python manage.py check
      - name: Apply migrations to fresh SQLite
        working-directory: server
        run: python manage.py migrate --noinput
      - name: Import and validate the actual car catalog
        working-directory: server
        run: |
          python manage.py shell -c 'from djangoapp.populate import initiate; print(initiate())'
          python manage.py shell -c 'from djangoapp.models import CarMake, CarModel; assert CarMake.objects.count() >= 5; assert CarModel.objects.count() >= 100; print("PASS: Car makes and models persisted")'

  full-stack-integration:
    name: Express + MongoDB + Django + Flask integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/dealershipsDB
      PORT: '3030'
      backend_url: http://127.0.0.1:3030
      sentiment_analyzer_url: http://127.0.0.1:5050/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/database/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install API and Python dependencies
        run: |
          npm ci --prefix server/database --no-audit --no-fund
          python -m pip install 'Django==5.2.18' requests python-dotenv Flask nltk
      - name: Django database setup
        working-directory: server
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py shell -c 'from djangoapp.populate import initiate; print(initiate())'
      - name: Run four-service live integration tests
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "GitHub Actions run: ${GITHUB_RUN_ID}" | tee CICD
          echo "Git commit: ${GITHUB_SHA}" | tee -a CICD
          echo "Real API and integration tests" | tee -a CICD

          ( cd server/database && node app.js ) > ci-express.log 2>&1 &
          EXPRESS_PID=$!
          ( cd server/djangoapp/microservices && python -u app.py ) > ci-flask.log 2>&1 &
          FLASK_PID=$!
          ( cd server && python -u manage.py runserver 127.0.0.1:8000 --noreload ) > ci-django.log 2>&1 &
          DJANGO_PID=$!
          trap 'kill "$EXPRESS_PID" "$FLASK_PID" "$DJANGO_PID" 2>/dev/null || true' EXIT

          for endpoint in             http://127.0.0.1:3030/health             http://127.0.0.1:5050/health             http://127.0.0.1:8000/about; do
            healthy=0
            for attempt in $(seq 1 50); do
              if curl -fsS --max-time 3 "$endpoint" >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "FAIL: Service unavailable: $endpoint" | tee -a CICD
              for logfile in ci-express.log ci-flask.log ci-django.log; do
                echo "===== $logfile ====="
                tail -50 "$logfile" || true
              done
              exit 1
            fi
            echo "PASS: $endpoint" | tee -a CICD
          done

          python3 scripts/verify_q8_q11.py 2>&1 | tee -a CICD
          python3 scripts/verify_q14_q16.py 2>&1 | tee -a CICD

          python3 - <<'PYTEST' | tee -a CICD
          import json
          from urllib.request import urlopen
          def get(path):
              with urlopen('http://127.0.0.1:8000' + path, timeout=15) as response:
                  assert response.status == 200, response.status
                  return json.load(response)
          dealers = get('/djangoapp/get_dealers')
          assert dealers.get('status') == 200 and len(dealers['dealers']) >= 50
          print('PASS: Django lists 50+ real dealers')
          kansas = get('/djangoapp/get_dealers/Kansas')
          assert kansas.get('status') == 200 and any(d['state'] == 'Kansas' for d in kansas['dealers'])
          print('PASS: Django filters Kansas dealerships')
          models = get('/djangoapp/get_cars')
          assert len(models['CarModels']) >= 100
          print('PASS: Django serves car models for review form')
          print('PASS: Full-stack public GET endpoints verified')
          PYTEST
          echo 'PASS: End-to-end CI integration successful' | tee -a CICD
          cat CICD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual GitHub Actions test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cars-dealership-CICD-evidence
          path: |
            CICD
            ci-express.log
            ci-flask.log
            ci-django.log
          if-no-files-found: warn
